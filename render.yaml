
services:
  - type: web
    name: nabz-checker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHANNEL_USERNAME
        value: dollariran5
      - key: TGJU_API_BASE
        value: https://nabz-tgju.onrender.com

  - type: web
    name: nabz-tgju
    runtime: image
    plan: free
    image:
      url: ghcr.io/amiranmanesh/tgju-api-go:latest
